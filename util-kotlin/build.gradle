        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        dataBinding true
        compose true
    }
    namespace 'com.example.utlikotlin'
    lint {
        targetSdk 36
    }
    testOptions {
        targetSdk 36
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

